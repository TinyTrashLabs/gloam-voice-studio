name: GloamVoiceStudio
options:
  bundleIdPrefix: fm.gloam
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  GloamVoiceStudioPackage:
    path: .
targets:
  GloamVoiceStudio:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Vendor/**"
      # Docs ship in the bundle so Help → Gloam Documentation works offline.
      - path: docs
        buildPhase: resources
        includes:
          - "app-guide.md"
          - "api.md"
          - "mcp.md"
    dependencies:
      - package: GloamVoiceStudioPackage
        product: EngineKit
      - package: GloamVoiceStudioPackage
        product: StudioKit
      - package: GloamVoiceStudioPackage
        product: SpeechKit
      - framework: App/Vendor/sherpa-onnx/libsherpa-onnx-c-api.dylib
        embed: true
        codeSign: true
        link: false
      - framework: App/Vendor/sherpa-onnx/libonnxruntime.1.27.0.dylib
        embed: true
        codeSign: true
        link: false
    entitlements:
      path: App/GloamVoiceStudio.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Shared Models/ and Voices/ with the other Gloam apps (Butler).
        # macOS requires the Team ID prefix; iOS's bare `group.` form is
        # rejected. Must also be registered on the App ID in the portal or
        # signing fails -- StoragePaths falls back to this app's own
        # container if the group can't be resolved at runtime.
        com.apple.security.application-groups:
          - UT233385J9.fm.gloam
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Gloam Voice Studio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.music
        NSMicrophoneUsageDescription: >-
          Gloam records short reference clips so you can clone voices you have
          the rights to use. Audio never leaves this Mac.
        NSSpeechRecognitionUsageDescription: >-
          Gloam transcribes reference clips and dictation on this Mac using
          Apple's on-device speech recognition. Audio never leaves this Mac.
        NSAudioCaptureUsageDescription: >-
          Gloam can record what your Mac is playing to capture a reference
          clip for voice cloning. Audio never leaves this Mac.
        # Claims .gvoice so a double-clicked or AirDropped pack opens HERE.
        # Declaring the type above only names it; without this the sole
        # registered handler is Archive Utility, which unzips the pack into
        # loose files instead of importing it. Scoped to the custom UTI alone —
        # claiming public.zip-archive would take over every zip on the Mac.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Gloam voice pack
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - fm.gloam.gvoice
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: fm.gloam.gvoice
            UTTypeConformsTo:
              - public.zip-archive
            UTTypeDescription: Gloam voice pack
            UTTypeTagSpecification:
              public.filename-extension:
                - gvoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.gloam.studio
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "7"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [GloamVoiceStudioUITests]
  GloamVoiceStudioUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: GloamVoiceStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
